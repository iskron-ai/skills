name: CI

# Most of what ships here is prose, and a malformed SKILL.md frontmatter (e.g. an
# unescaped quote in a description) installs silently into every agent that loads
# the skill, degrading methodology with no crash. This workflow is the loud gate:
# it validates the frontmatter contract and proves the committed .skill bundles
# match their source. Some of what ships is code — the bundled iskron-bridge and
# the two standing watchdogs — and it carries behavioural suites, because those
# failures (a dead callback listener, a burnt refresh grant, a watchdog that
# holds a dead token in silence) are invisible to the agent and land on a human.
# Each suite runs on the Node version its artifact claims: the bridge on 20, the
# watchdogs on 22, since they take the global WebSocket.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: make validate

  bundles-in-sync:
    name: .skill bundles match source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed bundles match skills/ (content, not raw bytes)
        run: make check-bundles

  surface-lint:
    name: Corpus matches the surface snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint tool names and enum values against fixtures/surface.json
        run: make check-surface

  bridge-tests:
    name: iskron-bridge behaves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Drive the bridge over stdio against a local fake NKS + OAuth server
        run: make test

  watchdog-tests:
    name: standing watchdogs behave
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run both watchdogs against a socket that closes with a dead-token code
        run: make test-watchdog

  plugin-archive:
    name: Plugin archive builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the claude.ai plugin archive (its first real run must not be at release time)
        run: make plugin
