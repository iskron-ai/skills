name: CI

# Most of what ships here is prose, and a malformed SKILL.md frontmatter (e.g. an
# unescaped quote in a description) installs silently into every agent that loads
# the skill, degrading methodology with no crash. This workflow is the loud gate:
# it validates the frontmatter contract and proves the committed .skill bundles
# match their source. Some of what ships is code — one file carrying the bridge,
# both standing watchdogs and doctor, the pi extension, the roadmap renderer —
# built from js/ and held to a production ladder: lint, format, strict types
# (the extension against pi's real types), the committed outputs being the release
# build (every install channel takes main), and the behavioural suites against a
# dev build of the tree. Those failures (a dead callback
# listener, a burnt refresh grant, a watchdog that holds a dead token in
# silence) are invisible to the agent and land on a human.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: make validate

  bundles-in-sync:
    name: .skill bundles match source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify committed bundles match skills/ (bytes)
        run: make check-bundles

  surface-lint:
    name: Corpus matches the surface snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Lint tool names and enum values against fixtures/surface.json
        run: make check-surface

  core-boundary:
    name: Bridge core names no delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: No Cyrillic, product name or L( in js/{bridge,shared,opencode,extension,watchdog,cli}
        run: make check-core

  widgets-in-sync:
    name: Widgets skill matches its snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify skills/widgets/SKILL.md renders from fixtures/widgets.json (bytes)
        run: make check-widgets

  js:
    name: Shipped JS — lint, types, outputs, behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the outputs lock walks the whole push (github.event.before..HEAD)
      - uses: actions/setup-node@v4
        with:
          # The floor the shipped file claims (global WebSocket): the suites run
          # here so the claim stays proven, not on whatever is newest.
          node-version-file: .nvmrc
      # The npm cache (graph @nks/nks-dev, node #6988): keyed by the lock file, saved only
      # here, only on main and only on a miss; release-please's bundle-sync only restores.
      # The key and path are setup-node's own, so the entries it saved stay readable.
      - name: npm cache key
        id: npm-cache-key
        run: |
          echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
          echo "key=node-cache-$RUNNER_OS-$(node -p process.arch)-npm-${{ hashFiles('js/package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-key.outputs.dir }}
          key: ${{ steps.npm-cache-key.outputs.key }}
      - run: make deps
      - if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.npm-cache-key.outputs.dir }}
          key: ${{ steps.npm-cache-key.outputs.key }}
      - run: make lint
      - run: make format-check
      - run: make typecheck
      - name: Committed outputs are the release build (no dev mark; only the release job writes them)
        run: make check-js
      # The lock: a PR from any branch but the release job's leaves the committed outputs
      # as its base has them (HEAD^1 of the PR's merge commit is the base tip); a push to
      # main is walked commit by commit from github.event.before, and only the release PR's
      # own merge commit may change them. The script reads the event from the environment.
      - name: Committed outputs untouched outside the release PR
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash scripts/check-outputs-frozen.sh
      # The bridge's callback rungs sit in 42000–43999, inside Linux's ephemeral range: under the
      # suites' own load the runner's sockets can hold every rung, and a probe meets «all candidate
      # callback ports are held» that is not its subject. The ladder is proven by its own squatter probes.
      - name: Ephemeral ports off the callback rungs
        run: sudo sysctl -w net.ipv4.ip_local_port_range="44000 60999"
      - name: Behavioural suites against the dev build of js/ in dist/dev (fake NKS + OAuth, fake bridge, fake socket)
        run: make test-coverage
